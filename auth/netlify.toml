[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/nova/.well-known/openid-configuration"
  to = "https://auth-api-nova.lanzar.me/nova/.well-known/openid-configuration"
  status = 200
  force = true

[[redirects]]
  from = "/nova/.well-known/jwks.json"
  to = "https://auth-api-nova.lanzar.me/.well-known/jwks.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
