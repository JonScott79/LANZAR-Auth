<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Portal</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Mock Portal (Testing Auth Flow)</h1>
    <div id="status">Checking authentication...</div>
    <div id="action"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Same config as production
        const firebaseConfig = {
            apiKey: "AIzaSyCm11MJPwYKk2ckDIrTOGLNHdyFkdCOM2k",
            authDomain: "lanzar-95ae3.firebaseapp.com",
            projectId: "lanzar-95ae3"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Crypto Helpers for PKCE
        function generateRandomString(length = 43) {
            const array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('').substring(0, length);
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        const statusEl = document.getElementById('status');
        const actionEl = document.getElementById('action');

        onAuthStateChanged(auth, async (user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');

            if (user) {
                statusEl.innerHTML = `<h3>Logged in as: ${user.email} (${user.uid})</h3>`;
                actionEl.innerHTML = `<button id="logoutBtn">Logout</button>`;
                document.getElementById('logoutBtn').onclick = () => signOut(auth);
                // Clear URL if code is present
                if (code) window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            if (code) {
                statusEl.innerHTML = 'Exchanging authorization code...';
                const storedState = sessionStorage.getItem('pkce_state');
                const codeVerifier = sessionStorage.getItem('pkce_code_verifier');

                if (state !== storedState) {
                    statusEl.innerHTML = 'Error: State mismatch (possible CSRF)';
                    return;
                }

                try {
                    const res = await fetch('http://localhost:4001/exchange', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code,
                            client_id: 'portal',
                            redirect_uri: window.location.origin + window.location.pathname,
                            code_verifier: codeVerifier
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error_description || data.error || 'Exchange failed');

                    statusEl.innerHTML = 'Signing in with Custom Token...';
                    await signInWithCustomToken(auth, data.custom_token);
                } catch (e) {
                    statusEl.innerHTML = 'Error during exchange: ' + e.message;
                }
            } else {
                statusEl.innerHTML = 'Not logged in.';
                actionEl.innerHTML = `<button id="loginBtn">Login via Auth Hub</button>`;
                
                document.getElementById('loginBtn').onclick = async () => {
                    const state = generateRandomString();
                    const codeVerifier = generateRandomString(64);
                    const codeChallenge = await generateCodeChallenge(codeVerifier);

                    sessionStorage.setItem('pkce_state', state);
                    sessionStorage.setItem('pkce_code_verifier', codeVerifier);

                    const redirectUri = window.location.origin + window.location.pathname;
                    const authUrl = `http://localhost:4000/?client_id=portal&redirect_uri=${encodeURIComponent(redirectUri)}&state=${state}&code_challenge=${codeChallenge}&code_challenge_method=S256`;
                    
                    window.location.href = authUrl;
                };
            }
        });
    </script>
</body>
</html>
